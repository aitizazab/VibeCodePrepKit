<text x="970.0" y="404.5" font-size="9.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#555">S</text>
<text x="1000.0" y="408" font-size="12" fill="#2b2b33">Switch: open or shut per night</text>
<text x="958.0" y="438" font-size="12" fill="#2b2b33" font-weight="600">Linking keeps the street easy to build</text>
<text x="958.0" y="454" font-size="12" fill="#2b2b33" font-weight="400">but the dense place has no reason to</text>
<text x="958.0" y="470" font-size="12" fill="#2b2b33" font-weight="400">be in Elias&#x27;s Saturday, and the street</text>
<text x="958.0" y="486" font-size="12" fill="#2b2b33" font-weight="400">stays empty: the creator&#x27;s objection.</text>
